command:
  - "python"
  - "weather_mcp_server.py"

env:
  # Open-Meteo needs no key. Only the NWS alerts endpoint asks for a contact
  # address in the User-Agent - put a real one here.
  - name: NWS_USER_AGENT
    value: "weather-mcp-bootcamp (your-email@example.com)"
  # Thresholds for predict_umbrella_needed, tunable without a code change.
  - name: UMBRELLA_CHANCE_PCT
    value: "40"
  - name: UMBRELLA_MM
    value: "1.0"
